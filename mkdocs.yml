# GENERATED by framework/scripts/build_site.py - do not edit.
# Change journeys/<slug>/journey.yml or the scaffold template.

site_name: Learning journeys
site_url: https://sk-service.github.io/journey-to-ai/
repo_url: https://github.com/SK-Service/journey-to-ai
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer      # next/previous - keeps the journey linear
    - navigation.indexes
    - content.code.copy      # kills the smart-quote paste failure
    - content.tooltips
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition                 # the callout boxes
  - attr_list                  # needed by grid cards on the landing page
  - md_in_html
  - footnotes
  - tables
  - pymdownx.details           # ??? collapsible hints
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SK-Service

nav:
  - Home: index.md
  - From Mathematics to LLMs:
    - Start here: bonsai-llm/index.md
    - Foundations:
      - 00 · Set Up Your Workshop: bonsai-llm/stage-00-setup.md
      - 01 · Build Your Own Mini Math Engine: bonsai-llm/stage-01-mini-math-engine.md
      - 02a · Get Real Data and Look at It: bonsai-llm/stage-02a-data.md
      - 02b · Teach a Line to Fit Itself: bonsai-llm/stage-02b-gradient-descent.md
